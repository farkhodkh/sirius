server:
  port: ${SERVER_PORT:9000}
spring:
  application:
    name: auth-service
  datasource:                                    # рантайм-подключение: роль auth_app (только DML)
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: auth-pool
  liquibase:                                     # миграции идут под другой ролью: auth_migrator (DDL)
    url: ${DB_URL}
    user: ${DB_MIGRATOR_USER}
    password: ${DB_MIGRATOR_PASSWORD}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                         # Hibernate только сверяет схему, ничего не меняет
    properties:
      hibernate:
        default_schema: app

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  liquibase:
    url: ${DB_URL}
    user: ${DB_MIGRATOR_USER:auth_migrator}      # миграции идут под ролью с правами DDL
    password: ${DB_MIGRATOR_PASSWORD}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

server:
  port: 9000

sirius:
  auth:
    issuer: ${SIRIUS_AUTH_ISSUER:http://localhost:9000}
    public-url: ${SIRIUS_AUTH_PUBLIC_URL:http://localhost:9000}
    mail-from: no-reply@sirius.local

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

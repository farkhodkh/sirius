spring:
  datasource:
    url: jdbc:h2:mem:notif;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS app
    username: sa
    password: ""
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_schema: app
  rabbitmq:
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false          # в тестах слушатели не подключаются к брокеру
  mail:
    host: localhost
management:
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false
sirius:
  notification:
    mail-from: no-reply@sirius.local
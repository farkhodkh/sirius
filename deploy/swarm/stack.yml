# Приложения Сириуса в Docker Swarm. Данные (Postgres, Redis, RabbitMQ, Mailpit) остаются в Compose и
# подключены к общей overlay-сети "shared". Запуск:
#   set -a; source ../compose/.env; set +a
#   docker stack deploy -c stack.yml sirius

x-java: &java
  networks: [edge, shared]
  environment: &java-env
    MANAGEMENT_SERVER_PORT: "9091"
    SERVER_FORWARD_HEADERS_STRATEGY: framework
    SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/"   # файлы секретов становятся свойствами (DB_PASSWORD и т. д.)
    SIRIUS_AUTH_ISSUER: ${SIRIUS_AUTH_ISSUER:-https://auth.sirius.test}

x-deploy: &deploy                                  # общие правила обновления и перезапуска
  update_config:
    parallelism: 1                                 # обновлять по одной реплике
    delay: 10s                                     # пауза между репликами
    order: start-first                             # сначала запустить новую, потом остановить старую (без простоя)
    failure_action: rollback                       # при неудаче автоматически откатиться
  rollback_config:
    parallelism: 1
  restart_policy:
    condition: on-failure                          # у Swarm нет depends_on: сервис перезапускается, пока БД не станет доступна
    delay: 5s
    max_attempts: 20

services:
  auth-service:
    <<: *java
    image: sirius/auth-service:0.1.0
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: auth_app
      DB_MIGRATOR_USER: auth_migrator
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SIRIUS_AUTH_PUBLIC_URL: ${SIRIUS_AUTH_PUBLIC_URL:-https://auth.sirius.test}
    secrets:
      - { source: auth_app_password,      target: DB_PASSWORD }            # имя файла = имя свойства
      - { source: auth_migrator_password, target: DB_MIGRATOR_PASSWORD }
    deploy:
      <<: *deploy
      replicas: 1
      resources: { limits: { memory: 512M, cpus: "1.0" }, reservations: { memory: 256M } }
      labels:                                      # В SWARM метки Traefik задаются в deploy.labels, а не в labels
        - traefik.enable=true
        - traefik.http.routers.auth.rule=Host(`auth.${SIRIUS_DOMAIN:-sirius.test}`)
        - traefik.http.routers.auth.entrypoints=websecure
        - traefik.http.routers.auth.tls=true
        - traefik.http.routers.auth.middlewares=secure-headers@file
        - traefik.http.services.auth.loadbalancer.server.port=9000
        - traefik.http.routers.auth-login.rule=Host(`auth.${SIRIUS_DOMAIN:-sirius.test}`) && (Path(`/login`) || PathPrefix(`/api/auth`))
        - traefik.http.routers.auth-login.priority=100
        - traefik.http.routers.auth-login.entrypoints=websecure
        - traefik.http.routers.auth-login.tls=true
        - traefik.http.routers.auth-login.middlewares=ratelimit-auth@file,secure-headers@file
        - traefik.http.routers.auth-login.service=auth

  order-service:
    <<: *java
    image: sirius/order-service:0.1.0
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/orders_db
      DB_USER: order_app
      DB_MIGRATOR_USER: order_migrator
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER}
      SIRIUS_OUTBOX_PUBLISHER_ENABLED: "true"
      SIRIUS_AUTH_JWKS_URI: http://auth-service:9000/oauth2/jwks
    secrets:
      - { source: order_app_password,      target: DB_PASSWORD }
      - { source: order_migrator_password, target: DB_MIGRATOR_PASSWORD }
      - { source: redis_password,          target: REDIS_PASSWORD }
      - { source: rabbit_password,         target: RABBIT_PASSWORD }
    deploy:
      <<: *deploy
      replicas: 3                                  # три экземпляра за балансировщиком
      resources: { limits: { memory: 512M, cpus: "1.0" }, reservations: { memory: 256M } }
      labels:
        - traefik.enable=true
        - traefik.http.routers.orders.rule=Host(`api.${SIRIUS_DOMAIN:-sirius.test}`) && PathPrefix(`/api/v1/orders`)
        - traefik.http.routers.orders.entrypoints=websecure
        - traefik.http.routers.orders.tls=true
        - traefik.http.routers.orders.middlewares=ratelimit-api@file,secure-headers@file
        - traefik.http.services.orders.loadbalancer.server.port=8081

  notification-service:
    <<: *java
    image: sirius/notification-service:0.1.0
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/notif_db
      DB_USER: notif_app
      DB_MIGRATOR_USER: notif_migrator
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    secrets:
      - { source: notif_app_password,      target: DB_PASSWORD }
      - { source: notif_migrator_password, target: DB_MIGRATOR_PASSWORD }
      - { source: rabbit_password,         target: RABBIT_PASSWORD }
    deploy:
      <<: *deploy
      replicas: 2                                  # два потребителя одной очереди делят нагрузку; дубликаты отсекает processed_events
      resources: { limits: { memory: 512M, cpus: "1.0" }, reservations: { memory: 256M } }

  docker-socket-ro:                                # прокси к Docker ТОЛЬКО ДЛЯ ЧТЕНИЯ для Traefik
    image: tecnativa/docker-socket-proxy
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NODES: 1
      NETWORKS: 1
      INFO: 1
      POST: 0
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [socket]
    deploy:
      placement: { constraints: ["node.role == manager"] }   # сокет менеджера нужен для сведений о кластере

  traefik:
    image: traefik:v3.7
    command:
      - --providers.swarm=true                     # провайдер Swarm вместо docker
      - --providers.swarm.endpoint=tcp://docker-socket-ro:2375
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=sirius_edge      # имя сети = имя стека + "_" + имя сети из этого файла
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --accesslog=true
    ports:
      - { target: 80,  published: 80,  mode: host }    # mode: host сохраняет настоящий IP клиента (иначе виден IP внутренней сети)
      - { target: 443, published: 443, mode: host }
    volumes:
      - /home/dev/sirius/deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro   # абсолютные пути: относительных в Swarm нет
      - /home/dev/sirius/deploy/traefik/certs:/certs:ro
    networks: [edge, socket]
    deploy:
      mode: global
      placement: { constraints: ["node.role == manager"] }

networks:
  edge:                                            # в сети edge стоят Traefik и приложения
    driver: overlay
  shared:                                          # общая сеть с контейнерами из Compose (данные)
    external: true
    name: sirius_shared
  socket:
    driver: overlay
    internal: true

secrets:
  auth_app_password:       { external: true }
  auth_migrator_password:  { external: true }
  order_app_password:      { external: true }
  order_migrator_password: { external: true }
  notif_app_password:      { external: true }
  notif_migrator_password: { external: true }
  redis_password:          { external: true }
  rabbit_password:         { external: true }
